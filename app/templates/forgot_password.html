{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100" style="padding: 1rem;">
  <div class="card p-4 shadow w-100 fade-in-up" style="max-width: 400px; border-radius: 20px;">
    <h4 class="text-center mb-4">Forgot Password</h4>
    <form method="POST" action="{{ url_for('routes.forgot_password') }}">
      <div class="mb-3">
        <input type="email" class="form-control" name="email" placeholder="Enter your registered email" required>
      </div>
      <button type="submit" class="btn btn-success w-100 ripple-btn">Send Reset Link</button>
    </form>
    <p class="text-center mt-3"><a href="{{ url_for('routes.login') }}">Back to Login</a></p>
  </div>
</div>
{% endblock %}
