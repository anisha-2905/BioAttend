{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100" style="padding: 1rem;">
  <div class="card p-4 shadow w-100 fade-in-up" style="max-width: 400px; border-radius: 20px;">
    <div class="text-center mb-4">
      <h5 class="text-muted">Reset Your Password</h5>
    </div>
    <form method="POST">
      <div class="mb-3">
        <input type="password" class="form-control" name="password" placeholder="New Password" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" name="confirm_password" placeholder="Confirm New Password" required>
      </div>
      <button type="submit" class="btn btn-success w-100 ripple-btn">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
